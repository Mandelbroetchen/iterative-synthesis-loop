<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ISL IDE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.36.1/min/vs/loader.min.js"></script>
    
    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1e1e1e; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }

        /* Standard CSS for Menus */
        .menu-btn {
            padding: 4px 12px;
            cursor: pointer;
            font-size: 0.875rem; /* text-sm */
            user-select: none;
        }
        .menu-btn:hover {
            background-color: #374151; /* bg-gray-700 */
        }
        
        .dropdown-menu {
            position: absolute;
            background-color: #1f2937; /* bg-gray-800 */
            border: 1px solid #374151; /* border-gray-700 */
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            margin-top: 4px;
            z-index: 50;
            min-width: 180px;
            display: none; /* Hidden by default */
        }
        
        .dropdown-menu.show {
            display: block; /* Show when active */
        }

        .dropdown-item {
            padding: 6px 16px;
            cursor: pointer;
            font-size: 0.875rem;
            color: #d1d5db; /* text-gray-300 */
        }
        .dropdown-item:hover {
            background-color: #374151;
            color: white;
        }
    </style>
</head>
<body class="bg-gray-900 text-white h-screen flex flex-col overflow-hidden" 
      x-data="appData()" x-init="initApp()" @click="closeMenus()">

    <div class="h-10 bg-gray-800 border-b border-gray-700 flex items-center px-2 select-none relative z-50">
        
        <div class="relative">
            <div @click.stop="toggleMenu('file')" class="menu-btn">File</div>
            <div :class="{'show': activeMenu === 'file'}" class="dropdown-menu">
                <div @click="openProjectDialog()" class="dropdown-item">📂 Open Project...</div>
                <div @click="newProjectDialog()" class="dropdown-item">✨ New Project...</div>
                <div class="border-t border-gray-700 my-1"></div>
                <div @click="saveFile()" class="dropdown-item">💾 Save File</div>
            </div>
        </div>

        <div class="relative">
            <div @click.stop="toggleMenu('compile')" class="menu-btn">Compile</div>
            <div :class="{'show': activeMenu === 'compile'}" class="dropdown-menu">
                <div @click="runCompile()" class="dropdown-item">▶ Run Compile (isl.py)</div>
            </div>
        </div>

        <div class="relative">
            <div @click.stop="toggleMenu('windows')" class="menu-btn">Windows</div>
            <div :class="{'show': activeMenu === 'windows'}" class="dropdown-menu">
                <div @click="toggleTerminal()" class="dropdown-item">
                    <span x-text="showTerminal ? 'Hide Terminal' : 'Show Terminal'"></span>
                </div>
            </div>
        </div>

        <div class="relative">
            <div @click.stop="toggleMenu('git')" class="menu-btn">Git</div>
            <div :class="{'show': activeMenu === 'git'}" class="dropdown-menu">
                 <div class="dropdown-item text-gray-500 cursor-not-allowed">Versions (Coming Soon)</div>
                 <div class="dropdown-item text-gray-500 cursor-not-allowed">Commit (Coming Soon)</div>
            </div>
        </div>
        
        <div class="ml-auto text-xs text-gray-500 mr-4 font-mono truncate max-w-xs" 
             x-text="currentWorkspace ? 'Workspace: ' + currentWorkspace : 'No Workspace Open'"></div>
    </div>

    <div class="flex-1 flex overflow-hidden relative z-0">
        
        <div class="w-64 bg-[#1e1e1e] border-r border-gray-700 flex flex-col flex-shrink-0">
            <div class="p-3 text-xs font-bold text-gray-400 uppercase tracking-wider">Explorer</div>
            <div class="flex-1 overflow-y-auto px-2 pb-2">
                
                <template x-if="files.length === 0">
                    <div class="text-center mt-10 text-gray-600 text-xs">
                        No folder open.<br>Go to File > Open Project
                    </div>
                </template>

                <ul class="text-sm">
                    <template x-for="item in files" :key="item.path">
                        <li class="mb-1">
                            <div @click="loadFile(item)" class="py-1 px-2 rounded hover:bg-gray-800 cursor-pointer flex items-center gap-2 truncate text-gray-300">
                                <span x-text="item.type === 'folder' ? '📁' : '📄'"></span>
                                <span x-text="item.name"></span>
                            </div>
                            
                            <ul x-if="item.type === 'folder' && item.children && item.children.length > 0" class="pl-4 border-l border-gray-700 ml-2 mt-1">
                                <template x-for="child in item.children" :key="child.path">
                                    <li @click.stop="loadFile(child)" class="py-1 px-2 rounded hover:bg-gray-800 cursor-pointer flex items-center gap-2 truncate text-gray-400">
                                        <span x-text="child.type === 'folder' ? '📁' : '📄'"></span>
                                        <span x-text="child.name"></span>
                                    </li>
                                </template>
                            </ul>
                        </li>
                    </template>
                </ul>
            </div>
        </div>

        <div class="flex-1 flex flex-col bg-[#1e1e1e] min-w-0">
            <div class="h-9 bg-[#2d2d2d] flex items-center px-2 border-b border-[#1e1e1e]">
                <div class="text-xs text-gray-300 bg-[#1e1e1e] px-4 py-1.5 rounded-t border-t-2 border-blue-500 flex items-center gap-2">
                    <span x-text="currentFileName || 'Untitled'"></span>
                    <span x-show="unsaved" class="w-2 h-2 rounded-full bg-yellow-500 ml-2" title="Unsaved changes"></span>
                </div>
            </div>
            
            <div id="editor-container" class="flex-1 relative"></div>

            <div x-show="showTerminal" class="h-1/3 bg-[#1e1e1e] border-t border-gray-700 flex flex-col" x-transition>
                <div class="h-8 bg-[#2d2d2d] px-4 flex items-center justify-between text-xs font-semibold text-gray-300 border-b border-gray-700">
                    <span>TERMINAL OUTPUT</span>
                    <button @click="toggleTerminal()" class="hover:text-white px-2">✕</button>
                </div>
                <div class="flex-1 p-4 font-mono text-sm overflow-auto bg-[#1e1e1e]">
                    <div x-text="output" class="text-gray-300 whitespace-pre-wrap"></div>
                    <div x-text="error" class="text-red-400 whitespace-pre-wrap mt-2"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let editor;
        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.36.1/min/vs' }});
        
        function appData() {
            return {
                files: [],
                activeMenu: null,
                showTerminal: true,
                currentFile: null,
                currentFileName: '',
                currentWorkspace: '',
                output: 'Ready...',
                error: '',
                unsaved: false,
                
                initApp() {
                    this.refreshFiles();
                    this.initEditor();
                },

                initEditor() {
                    require(['vs/editor/editor.main'], () => {
                        editor = monaco.editor.create(document.getElementById('editor-container'), {
                            value: "// Select a file to view code",
                            language: 'python',
                            theme: 'vs-dark',
                            automaticLayout: true,
                            minimap: { enabled: false }
                        });
                        editor.onDidChangeModelContent(() => { 
                            if(this.currentFile) this.unsaved = true; 
                        });
                        editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS, () => { 
                            this.saveFile(); 
                        });
                    });
                },

                toggleMenu(menu) { this.activeMenu = this.activeMenu === menu ? null : menu; },
                closeMenus() { this.activeMenu = null; },
                toggleTerminal() { 
                    this.showTerminal = !this.showTerminal; 
                    setTimeout(()=> { if(editor) editor.layout(); }, 50); 
                },

                async refreshFiles() {
                    try {
                        const res = await fetch('http://localhost:8000/files');
                        if(res.ok) this.files = await res.json();
                    } catch(e) { console.error("Backend not running?"); }
                },

                async openProjectDialog() {
                    this.closeMenus();
                    // 1. Call backend to trigger native folder picker
                    const pickRes = await fetch('http://localhost:8000/system_pick_folder');
                    const pickData = await pickRes.json();
                    
                    if(!pickData.path) return; // User cancelled

                    // 2. Open the selected path
                    const res = await fetch('http://localhost:8000/open_folder', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ path: pickData.path })
                    });
                    
                    if(res.ok) {
                        const data = await res.json();
                        this.currentWorkspace = data.new_path;
                        this.refreshFiles();
                        this.output = `Workspace opened: ${data.new_path}`;
                        this.error = "";
                    }
                },

                async newProjectDialog() {
                    this.closeMenus();
                    alert("Please select the PARENT folder where the new project should be created.");
                    
                    // 1. Pick Parent Folder
                    const pickRes = await fetch('http://localhost:8000/system_pick_folder');
                    const pickData = await pickRes.json();
                    
                    if(!pickData.path) return; // User cancelled

                    // 2. Ask for Name
                    const name = prompt("Enter Project Name:");
                    if(!name) return;

                    // 3. Create Project
                    const res = await fetch('http://localhost:8000/create_project', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ parent_path: pickData.path, project_name: name })
                    });

                    if(res.ok) {
                        const data = await res.json();
                        this.currentWorkspace = data.path;
                        this.refreshFiles();
                        this.output = `Project Created: ${data.path}`;
                        this.error = "";
                    } else {
                        alert("Error: Folder might already exist or permission denied.");
                    }
                },

                async loadFile(file) {
                    if(file.type === 'folder') return;
                    
                    const res = await fetch('http://localhost:8000/read_file', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ path: file.path })
                    });
                    const data = await res.json();
                    
                    this.currentFile = file.path;
                    this.currentFileName = file.name;
                    editor.setValue(data.content);
                    this.unsaved = false;
                    
                    const ext = file.name.split('.').pop();
                    const langMap = {'py': 'python', 'js': 'javascript', 'html': 'html', 'css': 'css', 'json': 'json', 'md': 'markdown'};
                    monaco.editor.setModelLanguage(editor.getModel(), langMap[ext] || 'plaintext');
                    this.output = `Loaded: ${file.name}`;
                },

                async saveFile() {
                    if(!this.currentFile) return;
                    this.closeMenus();
                    await fetch('http://localhost:8000/save_file', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ path: this.currentFile, content: editor.getValue() })
                    });
                    this.unsaved = false;
                    this.output = `Saved: ${this.currentFileName} at ${new Date().toLocaleTimeString()}`;
                },

                async runCompile() {
                    this.closeMenus();
                    this.showTerminal = true;
                    setTimeout(()=> { if(editor) editor.layout(); }, 50);

                    this.output = "Compiling... (Running isl.py)";
                    this.error = "";
                    
                    const res = await fetch('http://localhost:8000/compile', { method: 'POST' });
                    const data = await res.json();
                    
                    this.output = data.stdout || "Command executed (No Output)";
                    if(data.stderr) this.error = data.stderr;
                }
            }
        }
    </script>
</body>
</html>
